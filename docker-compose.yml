            # MYSQL_PASSWORD: user
            # MYSQL_ROOT_PASSWORD: root
            # SERVICE_TAGS: dev
            # SERVICE_NAME: mysql
        # networks: 
            # - laravel

    php:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: php
        restart: unless-stopped
        tty: true
        working_dir: /var/www/app
        volumes: 
            - ./:/var/www/app
        ports: 
            - "9000:9000"
        networks: 
            - laravel


