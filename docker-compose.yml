version: '3'

networks: 
    laravel:
        driver: bridge

services: 
    nginx:
        image: nginx:alpine
        container_name: nginx
        restart: unless-stopped
        tty: true
        ports:
            - "3000:3000"
        volumes: 
            - ./:/var/www/app
            - ./nginx.conf:/etc/nginx/conf.d/default.conf
        depends_on: 
            - php
#            - mysql
        networks: 
            - laravel

    # mysql:
        # platform: linux/amd64
        # image: mysql
        # container_name: mysql
        # restart: unless-stopped
        # tty: true
        # ports: 
            # - "4306:3306"
